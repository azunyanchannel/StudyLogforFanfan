<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English AI Check-in</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 700px;
            width: 100%;
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 28px;
        }

        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 16px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 20px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #b2bec3;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            display: none;
            margin-top: 20px;
            color: var(--primary-color);
            font-weight: 500;
        }

        .error {
            color: #d63031;
            background-color: #fab1a0;
            padding: 15px;
            border-radius: 8px;
            display: none;
            margin-top: 20px;
            font-weight: 500;
        }

        .result-section {
            margin-top: 40px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card {
            background-color: #f8f9fc;
            border-left: 5px solid var(--primary-color);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
        }
        
        .result-card.level { border-left-color: #e1b12c; }
        .result-card.feedback { border-left-color: #44bd32; }
        .result-card.encouragement { border-left-color: #8c7ae6; }

        .result-card h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #2f3640;
            font-size: 18px;
            display: flex;
            align-items: center;
        }

        .result-card h3 span {
            margin-right: 8px;
        }

        .result-card p {
            margin: 0;
            color: #353b48;
            white-space: pre-wrap;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>English AI Check-in</h1>
        <p class="subtitle">Enter your today's English learning notes or diary below.</p>
        
        <textarea id="text-input" placeholder="Today I learned... / Dear diary..."></textarea>
        <button id="analyze-btn">Analyze</button>
        
        <div id="loading" class="loading">
            Analyzing your text with Gemini AI... Please wait.
        </div>
        <div id="error-message" class="error"></div>
        
        <div id="result-section" class="result-section">
            <div class="result-card level">
                <h3><span>📈</span> Estimated Level</h3>
                <p id="level-text"></p>
            </div>
            
            <div class="result-card feedback">
                <h3><span>📝</span> Feedback</h3>
                <p id="feedback-text"></p>
            </div>
            
            <div class="result-card encouragement">
                <h3><span>✨</span> Encouragement</h3>
                <p id="encouragement-text"></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('analyze-btn').addEventListener('click', async () => {
            const textInput = document.getElementById('text-input').value.trim();
            const btn = document.getElementById('analyze-btn');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('error-message');
            const resultSection = document.getElementById('result-section');
            
            // Elements to populate
            const levelText = document.getElementById('level-text');
            const feedbackText = document.getElementById('feedback-text');
            const encouragementText = document.getElementById('encouragement-text');

            if (!textInput) {
                alert("Please enter some text to analyze.");
                return;
            }

            // Reset UI state
            btn.disabled = true;
            loading.style.display = 'block';
            errorMsg.style.display = 'none';
            resultSection.style.display = 'none';

            try {
                // Send JSON request to Flask backend
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: textInput })
                });

                const data = await response.json();

                // Check HTTP status code
                if (!response.ok) {
                    throw new Error(data.error || "An error occurred during analysis.");
                }

                // Populate results
                levelText.innerText = data.level || "N/A";
                feedbackText.innerText = data.feedback || "No feedback provided.";
                encouragementText.innerText = data.encouragement || "Keep going!";
                
                // Show result section
                resultSection.style.display = 'block';
            } catch (error) {
                errorMsg.innerText = error.message;
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
