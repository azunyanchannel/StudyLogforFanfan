<!DOCTYPE html>
<html lang="zh-CN" id="html-root">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Lumina - 英语写作助手</title>
    <!-- Use Google Fonts (Inter and Playfair Display for quotes) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital@0;1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="glass-header">
            <div class="header-top">
                <div class="logo" data-i18n="logo">✨ Lumina</div>
                <button id="lang-toggle" class="lang-btn">EN / 中文</button>
            </div>
            <p class="subtitle" data-i18n="subtitle">提升你的英语写作水平</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Column: Input and Results -->
            <div class="left-panel stack-gap">
                <!-- Editor Section -->
                <section class="glass-card editor-section">
                    <div class="card-header">
                        <h2 data-i18n="newEssay">新作文</h2>
                        <span id="word-count" class="badge">0 <span data-i18n="words">词</span></span>
                    </div>
                    <textarea id="essay-input" data-i18n-placeholder="placeholder"
                        placeholder="在这里开始输入你的英语作文。我们将检查你的语法并进行字数统计..."></textarea>

                    <div class="button-group">
                        <button id="submit-btn" class="primary-btn" data-i18n="analyzeBtn">分析作文</button>
                        <button id="clear-btn" class="outline-btn" data-i18n="clearBtn">清空</button>
                    </div>
                </section>

                <!-- Results Section (Hidden initially) -->
                <section id="results-section" class="glass-card result-section hidden">
                    <h2 data-i18n="analysisResult">分析结果</h2>
                    <div id="loading-spinner" class="spinner hidden" data-i18n="loading">正在分析你的作文...</div>
                    <div id="analysis-content" class="hidden">
                        <div class="result-block">
                            <h3 data-i18n="grammarSuggestions">语法与建议</h3>
                            <ul id="grammar-feedback" class="feedback-list">
                                <!-- Mock grammar feedback will go here -->
                            </ul>
                        </div>
                    </div>
                </section>

                <!-- Daily Quote Section -->
                <div class="quote-card glass-card">
                    <p id="daily-quote" class="quote-text">"进步的秘诀全在于开始。"</p>
                    <p id="quote-author" class="quote-author">- 马克·吐温</p>
                </div>
            </div>

            <!-- Right Column: History and Puzzle -->
            <div class="right-panel stack-gap-small">

                <!-- Puzzle Reward Section -->
                <section class="glass-card puzzle-section">
                    <div class="card-header">
                        <h2 data-i18n="puzzleTitle">猫咪拼图奖励</h2>
                        <span id="puzzle-progress" class="badge">0/9</span>
                    </div>
                    <div class="puzzle-container" id="puzzle-container">
                        <!-- 9 puzzle pieces generated by JS -->
                    </div>
                    <p class="puzzle-hint" id="puzzle-hint" data-i18n="puzzleHint">提交作文来解锁拼图碎片！</p>
                </section>

                <section class="glass-card history-section">
                    <div class="card-header">
                        <h2 data-i18n="writingHistory">写作历史</h2>
                        <button id="clear-history-btn" class="text-btn" data-i18n="clearAllBtn">清空全部</button>
                    </div>
                    <div id="history-list" class="history-list">
                        <!-- History items will be injected here -->
                        <div class="history-empty" data-i18n="noNotes">没有找到记录。开始写作吧！</div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
